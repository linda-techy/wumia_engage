# The admin console container: the Angular build, and /api proxied to admin-api.
# Security headers are repeated per location: nginx drops server-level add_header
# in any location that sets its own.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, asked again every 10 s. nginx resolves a fixed proxy_pass
    # host once at start: when admin was recreated without this container,
    # requests kept going to admin's old address (taken by ingest) and every
    # /api call answered 502 until the console was restarted too (2026-10-28).
    # A variable in proxy_pass makes nginx resolve per request through this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_api http://admin:8083;

    location /api/ {
        proxy_pass $admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        # While admin-api restarts (a deploy), say so in the API's own shape, not nginx's HTML.
        proxy_intercept_errors off;
        error_page 502 503 504 = @restarting;
    }

    location = /.well-known/jwks.json {
        proxy_pass $admin_api;
    }

    location @restarting {
        default_type application/problem+json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"https://engage.wumika.com/errors/restarting","title":"Engage is restarting","status":503,"detail":"Engage is restarting after an update. Try again in a few seconds."}';
    }

    # The staff-alert service worker and the install manifest keep fixed names,
    # so they are revalidated on every load instead of cached for a year.
    location = /staff-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed bundles: cache for a year.
    location ~* \.(js|css|woff2?|png|svg|ico|txt)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The app shell: never cached, so a deploy is seen at once.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
