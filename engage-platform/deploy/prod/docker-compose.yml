# Production on the Wumika VPS (46.202.164.251). Lives at /opt/wumika next to .env.
# Images are built on the server from the compiled apps (deploy/prod/deploy.sh):
#   wumika/ingest-api:prod, wumika/admin-api:prod, wumika/worker:prod, wumika/console:prod
#
# nginx on the host terminates TLS:
#   engage.wumika.com -> 127.0.0.1:8081 (ingest)    admin.wumika.com -> 127.0.0.1:8090 (console)
# Nothing else is published; the database is reachable only on this network.

name: wumika

# 1 vCPU / 3.9 GB plus 2 GB swap: every service is memory-capped.
x-jvm: &jvm
  JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"

# Container logs go to the host's systemd journal (persistent, 1 GB / 7 days in
# /etc/systemd/journald.conf), so a deploy that recreates a container keeps its
# history. `docker compose logs <svc>` still works; older lines:
#   journalctl CONTAINER_NAME=wumika-worker-1 --since "2026-10-27 18:00"
x-logging: &journal
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  # Flyway as a job: every service waits for it; a failed migration stops the deploy.
  migrate:
    logging: *journal
    image: wumika/ingest-api:prod
    command: ["migrate"]
    restart: "no"
    env_file: .env
    mem_limit: 320m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    logging: *journal
    image: wumika/ingest-api:prod
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      INGEST_PORT: "8081"
      FLYWAY_ON_STARTUP: "false"
      ENDPOINTS_HEALTH_DETAILS_VISIBLE: NEVER
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    logging: *journal
    image: wumika/admin-api:prod
    restart: unless-stopped
    env_file: .env
    mem_limit: 448m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      ADMIN_API_PORT: "8083"
      ADMIN_JWT_KEY_FILE: /keys/admin-jwt.pem
      ENDPOINTS_HEALTH_DETAILS_VISIBLE: NEVER
    volumes:
      - ./keys:/keys
    # No published port: the console container proxies /api to it.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    logging: *journal
    image: wumika/worker:prod
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      WORKER_PORT: "8084"
      FIREBASE_SERVICE_ACCOUNT_FILE: /secrets/firebase-service-account.json
    volumes:
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The admin console: the Angular build served by nginx, /api proxied to admin-api.
  console:
    logging: *journal
    image: wumika/console:prod
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - admin

volumes:
  pgdata:
