# Dev deployment on the Wumika server. Lives at /opt/wumika next to .env
# (copied from .env.example and filled in once, by hand, on the server).
# CI copies this file and the images there on every push to `dev`.

name: wumika

# Dev shares the server with prod (deploy/prod): every service is capped so dev
# can never starve prod of memory. The start scripts honour JAVA_OPTS.
x-jvm: &jvm
  JAVA_OPTS: "-XX:MaxRAMPercentage=60"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    # No published port: only the services on this network reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  # Migrations as a job (P1-T06, 08-deployment-and-ops.md): the ingest image run
  # as `ingest-api migrate` applies Flyway and exits. Every service waits for it
  # to finish successfully; a failed migration stops the deploy before any
  # service starts on a schema it does not expect. Same shape on staging.
  migrate:
    image: wumika/ingest-api:dev
    command: ["migrate"]
    restart: "no"
    env_file: .env
    mem_limit: 256m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    image: wumika/ingest-api:dev
    restart: unless-stopped
    env_file: .env
    mem_limit: 384m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      INGEST_PORT: "8081"
      # The migrate job owns the schema; services never migrate on startup.
      FLYWAY_ON_STARTUP: "false"
      # /health is public through nginx; its details name the JDBC URL.
      ENDPOINTS_HEALTH_DETAILS_VISIBLE: NEVER
    ports:
      - "127.0.0.1:8081:8081"   # nginx terminates TLS in front of this
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: wumika/admin-api:dev
    restart: unless-stopped
    env_file: .env
    mem_limit: 320m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      ADMIN_API_PORT: "8083"
      ADMIN_JWT_KEY_FILE: /keys/admin-jwt.pem
    volumes:
      - ./keys:/keys
    # Localhost only until login and MFA (plan Tasks 7-8) are finished.
    # Reach it with: ssh -L 8083:127.0.0.1:8083 deploy@<server>
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: wumika/worker:dev
    restart: unless-stopped
    env_file: .env
    mem_limit: 384m
    environment:
      <<: *jvm
      DB_HOST: db
      DB_PORT: "5432"
      WORKER_PORT: "8084"
      # Mounted read-only below. The file is mode 400, owned by uid 10001 (the
      # image's user). A missing file stops the worker at boot, not at the first push.
      FIREBASE_SERVICE_ACCOUNT_FILE: /secrets/firebase-service-account.json
    volumes:
      # The file, not the directory: ./secrets is deploy:deploy 750, which uid
      # 10001 cannot enter. Docker resolves a file mount as root, so only the
      # file's own permissions (400, uid 10001) apply inside the container.
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    # No published port: /health is for the container runtime, and nothing
    # outside needs to reach the worker.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
