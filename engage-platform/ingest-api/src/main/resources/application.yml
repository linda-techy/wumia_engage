# Every value comes from environment variables, which `./gradlew :ingest-api:run`
# loads from config/local.env. Edit that file, not this one.
micronaut:
  application:
    name: engage-ingest
  server:
    port: ${INGEST_PORT:8080}
    # Shopify order payloads with many line items can be large.
    max-request-size: 2097152
  # P1-T05: Micrometer, scraped at /prometheus (MetricsAccessFilter guards it).
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:engage}
    username: ${DB_USER:engage_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: 10
    # Fail fast rather than queue: a webhook must be acknowledged within 5s.
    connection-timeout: 3000

flyway:
  datasources:
    default:
      # true locally; false in production, where migrations run as a job first.
      enabled: ${FLYWAY_ON_STARTUP:false}
      locations: classpath:db/migration

engage:
  shopify:
    shop-domain: ${SHOPIFY_SHOP_DOMAIN:}
    api-secret: ${SHOPIFY_API_SECRET:}
    client-id: ${SHOPIFY_CLIENT_ID:}
  razorpay:
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    mode: ${RAZORPAY_MODE:test}
    match-window-minutes: ${RAZORPAY_MATCH_WINDOW_MINUTES:30}
  metrics:
    # Bearer token for /prometheus. Empty = the endpoint answers 404.
    token: ${METRICS_TOKEN:}
  courier:
    # Shiprocket (ADR-005): the security token set in Shiprocket -> Settings ->
    # API -> Webhooks, sent as x-api-key. Empty = every courier webhook is 401.
    webhook-token: ${COURIER_WEBHOOK_TOKEN:}
  consent:
    # Date the checkout phone label started showing checkout_notice_v1's text
    # (e.g. 2026-10-01). Empty = off: no order-update basis from the notice.
    checkout-notice-since: ${CHECKOUT_NOTICE_SINCE:}
    # Which label text is live: checkout_notice_v2 (order updates and offers,
    # opt-out) or checkout_notice_v1 (order updates only).
    checkout-notice-version: ${CHECKOUT_NOTICE_VERSION:checkout_notice_v2}
  pixel:
    # Shared with the web pixel's settings (webPixelCreate). Public by nature:
    # it keeps out casual traffic only. Empty = /pixel/events answers 503.
    write-key: ${PIXEL_WRITE_KEY:}
  privacy:
    # Empty = refuse to start (fail closed). * = every customer.
    customer-allowlist-emails: ${CUSTOMER_ALLOWLIST_EMAILS:}

endpoints:
  prometheus:
    enabled: true
    sensitive: false        # guarded by MetricsAccessFilter (METRICS_TOKEN) instead
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
