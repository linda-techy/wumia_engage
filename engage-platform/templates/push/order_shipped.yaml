# Order updates by push (owner, 2026-10-29): for customers who allowed
# notifications but have no WhatsApp opt-in, or whose WhatsApp was not
# delivered within the wait. SMS is on hold. Utility: about their own order.
# Sent on order_shipped.
key: push_order_shipped_v1
channel: push
category: utility
locales:
  en: { title: "Your WUMIKA order is on its way 🚚", body: "Order {{order_no}} has shipped with {{courier}}. Tap to track it." }
vars: [courier, order_no, url]
samples: { courier: "Delhivery", order_no: "#WUM1183" }
