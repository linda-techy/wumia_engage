# Waitlist restock alert (phase-3 §4). Lead with the size and the product.
key: push_back_in_stock_v1
channel: push
category: utility          # the shopper asked for it
# No cooldown: the waitlist is the dedupe (each entry alerts once, and only
# re-arms when the shopper asks again). A per-template cooldown would hide a
# restock of a DIFFERENT item the shopper is also waiting for.
locales:
  en:      { title: "Size {{size}} is back: {{product}}", body: "Only a few pieces in this restock." }
  hi-Latn: { title: "Size {{size}} aa gaya: {{product}}", body: "Is restock mein kam pieces hain." }
vars: [size, product, url, image]
# The longest realistic values: the lint renders with these and checks the
# 40/90 limits. Longer names are cut with an ellipsis at send time.
samples: { size: "XXL", product: "Floral Anarkali Kurta" }
