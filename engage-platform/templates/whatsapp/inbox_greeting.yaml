# The WhatsApp inbox (V50): the instant answer to a new conversation inside
# support hours, which the WhatsApp Business app's greeting used to give. A
# free-form reply in the window the customer opened: free, never submitted to
# Meta. The buttons are an interactive message; each tap is an event.
key: inbox_greeting
channel: whatsapp
category: service
locales:
  en: { body: "Hi {{name}}, welcome to WUMIKA! ✨ How can we help you today? Tap an option below, or type your question and our team will reply shortly." }
buttons:
  - { text: "Track my order", reply: "inbox_track" }
  - { text: "Shop bestsellers", reply: "inbox_shop" }
  - { text: "Talk to us", reply: "inbox_talk" }
vars: [name]
samples: { name: "Priya" }
