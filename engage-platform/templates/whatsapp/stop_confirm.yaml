# The one reply to STOP (phase-4 §3): a free-form service message inside the
# 24 h window the STOP itself opened, so it is free and never submitted to
# Meta. It stops people reaching for "Block", which hurts the quality rating.
key: wa_stop_confirm
channel: whatsapp
category: service
locales:
