# Values come from environment variables, loaded from config/local.env by Gradle.
micronaut:
  application:
    name: engage-worker
  server:
    # /health and /prometheus only; nothing else is served.
    port: ${WORKER_PORT:8084}
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: PT1M

datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wumika_admin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: 10

# Flyway never runs here: ingest-api owns migrations.
flyway:
  enabled: false

engage:
  worker:
    # false stops every scheduled job (event dispatch, cascade tick, sweeper).
    jobs-enabled: ${WORKER_JOBS_ENABLED:true}
  whatsapp:
    # WhatsApp Cloud API (P4-T02). Empty WA_PHONE_NUMBER_ID = no WhatsApp
    # adapter: WhatsApp sends are recorded as no_adapter, nothing leaves.
    graph-version: ${WA_GRAPH_VERSION:v23.0}
    phone-number-id: ${WA_PHONE_NUMBER_ID:}
    # The WhatsApp Business Account: template sync, number quality, submitting
    # templates. Empty = none of that runs.
    business-account-id: ${WA_BUSINESS_ACCOUNT_ID:}
    access-token: ${WA_ACCESS_TOKEN:}
  email:
    # Marketing email through Amazon SES (P7-T01). Empty EMAIL_FROM = no email
    # adapter: the email steps of journeys are skipped. A verified sending
    # domain, e.g. "WUMIKA <hello@mail.wumika.com>".
    from: ${EMAIL_FROM:}
    region: ${SES_REGION:ap-south-1}
    configuration-set: ${SES_CONFIGURATION_SET:engage}
    unsubscribe-mailto: ${EMAIL_UNSUBSCRIBE_MAILTO:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}
  sms:
    msg91:
      # DLT SMS through MSG91 (P4-T06). Empty = no SMS adapter: SMS sends are
      # recorded as no_adapter, nothing leaves. Templates still PENDING on DLT
      # fail dlt_pending even when this is set.
      auth-key: ${MSG91_AUTH_KEY:}
  metrics:
    # Bearer token for /prometheus (same value as ingest-api). Empty = 404.
    token: ${METRICS_TOKEN:}

endpoints:
  prometheus:
    enabled: true
    sensitive: false        # guarded by MetricsAccessFilter (METRICS_TOKEN) instead
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER
