# build.gradle.kts points DB_NAME at TEST_DB_NAME; fixtures refuse any other name.
datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:engage_test}
    username: ${DB_USER:engage_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: 4

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
