# wumikaEngage-dev: DEV STORE ONLY (custom distribution to wumika-dev.myshopify.com).
# Never installed on the live store. Feeds the separate dev instance
# (config/devstore.env, port 8082, database wumika_admin_devstore).
#
# Deploy (only after confirming): npx shopify app deploy --config dev --allow-updates

client_id = "cd26e4e2196dcc7deefa2aa87a544bc1"
name = "wumikaEngage-dev"
# No app UI yet. Shopify redirects here after install; it does not need to serve anything.
application_url = "https://shopify.dev/"
embedded = false

[access_scopes]
# Read-only. read_orders covers orders/*, checkouts/* and carts/* webhooks;
# read_customers covers customers/*; read_inventory covers inventory_levels/*
# and, with read_products, the inventory item -> variant lookup (P1-T03).
# write_pixels + read_customer_events: the engage-pixel web pixel (P2-T06),
# activated with webPixelCreate.
scopes = "read_orders,read_customers,read_inventory,read_products,write_pixels,read_customer_events"
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

# Storefront /apps/push/* is forwarded to ingest-api, same-origin, so the
# service worker registers (phase-2 §1). Shopify signs every proxied request;
# AppProxyVerifier checks that signature.
[app_proxy]
url = "https://engage-dev.wumika.com/shopify/proxy"
subpath = "push"
prefix = "apps"

[webhooks]
api_version = "2026-07"

# Signed with THIS app's Client secret = SHOPIFY_API_SECRET in config/devstore.env.
# Quick tunnels change URL on restart: update uri, then redeploy.
[[webhooks.subscriptions]]
topics = ["checkouts/create", "checkouts/update", "orders/create",
          "orders/cancelled", "orders/paid", "refunds/create",
          "carts/create", "carts/update", "customers/create", "customers/update",
          "inventory_levels/update", "products/update", "app/uninstalled"]
uri = "https://engage-dev.wumika.com/webhooks/shopify"
