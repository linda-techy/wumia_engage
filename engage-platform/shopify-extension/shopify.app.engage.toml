# Engage: Partner-owned custom app (custom distribution to e4bac4-ef.myshopify.com).
# Replaces the use of wumikaApi for webhooks, because protected customer fields
# (name, email, phone, address) are always available to Partner custom apps.
#
# Deploy (only after confirming): npx shopify app deploy --config engage --allow-updates

client_id = "a177be0be506d6c11ba02b574e588d41"
name = "wumikaEngage"
# No app UI yet. Shopify redirects here after install; it does not need to serve anything.
application_url = "https://www.wumika.com/"
embedded = false

[access_scopes]
# read_orders covers orders/*, checkouts/* and carts/* webhooks; read_customers
# covers customers/*. write_discounts (owner's decision, 2026-10-11): the worker
# creates single-use abandoned-checkout and win-back codes; tested on wumika-dev.
# Takes effect only after a deploy and the owner approving it in the store admin.
scopes = "read_orders,read_customers,write_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[webhooks]
api_version = "2026-07"

# Signed with THIS app's Client secret = SHOPIFY_API_SECRET in config/local.env.
# Quick tunnels change URL on restart: update uri, then redeploy.
[[webhooks.subscriptions]]
topics = ["checkouts/create", "checkouts/update", "orders/create",
          "carts/create", "carts/update", "customers/create", "customers/update"]
uri = "https://adjustment-personality-self-meaning.trycloudflare.com/webhooks/shopify"

# Mandatory for every app (Shopify privacy compliance); same endpoint, same HMAC.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://adjustment-personality-self-meaning.trycloudflare.com/webhooks/shopify"
